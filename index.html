<!DOCTYPE html>
<html lang="uz-Cyrl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0b1220">
<title>Қанд назорати</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b1220;--card:#131c2e;--card2:#1a2540;--tx:#e8eefc;--mut:#93a1bd;--ac:#14b8a6;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--line:#24304d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:14px 14px 0}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
header h1{font-size:22px;margin:0}
header .d{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1;min-width:0}
.mut{color:var(--mut);font-size:14px}
.btn{border:0;border-radius:12px;padding:11px 14px;font-size:15px;font-weight:600;background:var(--card2);color:var(--tx);cursor:pointer;font-family:inherit}
.btn.p{background:var(--ac);color:#04201d}
.btn.ok{background:var(--ok);color:#052e12}
.btn.bad{background:transparent;color:var(--bad);border:1px solid #4b2430}
.btn.sm{padding:8px 11px;font-size:14px}
.btn.full{width:100%}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.3}
nav{position:fixed;bottom:0;left:0;right:0;background:#0e1626;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;cursor:pointer}
nav button b{font-size:22px;font-weight:400}
nav button.on{color:var(--ac)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#22304f;color:var(--mut);margin:2px 4px 2px 0;white-space:nowrap}
.tag.ok{background:#11351f;color:#86efac}.tag.bad{background:#3b1520;color:#fca5a5}.tag.warn{background:#3a2a0b;color:#fcd34d}
.alert{background:#3a2a0b;border:1px solid #6b4d10;color:#fde68a;border-radius:14px;padding:12px;margin-bottom:12px;font-size:14px}
.alert.i{background:#0f2e2b;border-color:#155e57;color:#99f6e4}
.alert.bad{background:#3b1520;border-color:#6b2433;color:#fecaca}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
.empty b{font-size:48px;display:block}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
input,select,textarea{width:100%;background:#0e1626;border:1px solid var(--line);color:var(--tx);border-radius:11px;padding:11px;font-size:16px;font-family:inherit}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac);flex:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 11px;border-radius:99px;background:#0e1626;border:1px solid var(--line);color:var(--tx);font-size:14px;font-family:inherit;cursor:pointer}
.chip.on{background:var(--ac);color:#04201d;border-color:var(--ac);font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 4px;font-size:20px}
.ring-alert{position:fixed;inset:0;background:rgba(4,10,20,.94);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.ring-alert.on{display:flex}
.ring-alert .pill{font-size:72px;animation:sh 1s infinite}
@keyframes sh{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#e8eefc;color:#0b1220;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;opacity:0;transition:.3s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border:0}
h3{margin:0 0 8px;font-size:16px}
h4{margin:16px 0 6px;font-size:14px}
h4:first-of-type{margin-top:4px}
/* Қанд назорати */
.hero{cursor:pointer}
.hrow{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.hv{font-size:56px;font-weight:700;line-height:1.05;letter-spacing:-1px}
.hs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);text-align:center}
.hs b{display:block;font-size:18px}.hs span{font-size:12px;color:var(--mut)}
.qa{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 4px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--tx);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
.qa button b{font-size:26px;font-weight:400;line-height:1}
.qa button:active{transform:scale(.96)}
.pend{display:flex;gap:8px;align-items:center;padding:10px;border-radius:12px;background:var(--card2);margin-top:8px}
.pend.due{box-shadow:0 0 0 2px var(--warn) inset}
.pend .pt{font-size:18px;font-weight:700;min-width:50px;font-variant-numeric:tabular-nums}
.pend .pn{font-weight:600;font-size:15px;line-height:1.25}
.lnk{background:none;border:0;color:var(--ac);font-size:14px;font-weight:600;padding:10px 0 2px;font-family:inherit;cursor:pointer;text-align:left}
.vin{display:flex;align-items:baseline;gap:10px;background:#0e1626;border:1px solid var(--line);border-radius:14px;padding:2px 14px;margin-top:10px}
.vin input{border:0;background:transparent;font-size:42px;font-weight:700;padding:6px 0;min-width:0;border-radius:0}
.vin input:focus{outline:none}
.vin span{color:var(--mut);white-space:nowrap}
.vin.sm input{font-size:24px}
.fst{min-height:26px;margin-top:8px}
.ml{padding:12px;border-radius:14px;background:var(--card2);margin-top:10px;cursor:pointer}
.ml .row{flex-wrap:wrap;gap:4px 8px}
.cvs{display:flex;gap:6px;margin-top:8px}
.cv{flex:1;text-align:center;background:#0e1626;border-radius:10px;padding:6px 2px;min-width:0}
.cv span{display:block;font-size:11px;color:var(--mut);white-space:nowrap}
.cv b{font-size:16px;font-variant-numeric:tabular-nums}
.sd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:4px;vertical-align:middle;background:var(--mut)}
.sd.ok{background:var(--ok)}.sd.warn{background:var(--warn)}.sd.bad{background:var(--bad)}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.it:last-child{border:0}
.it .t{min-width:44px;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.it .i{font-size:20px;width:26px;text-align:center;flex:none}
.kc .kv{font-size:20px;font-weight:700}
.pb{height:8px;border-radius:99px;background:#0e1626;overflow:hidden;margin-top:12px}
.pb i{display:block;height:100%;background:var(--ac);border-radius:99px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:9px;border-radius:9px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
.seg button.on{background:var(--ac);color:#04201d}
.pnav{display:flex;align-items:center;gap:10px;margin-bottom:12px;text-align:center}
.pnav b{font-size:17px}
.pnav .btn{min-width:46px;font-size:20px;padding:6px 12px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile .tl{font-size:13px;color:var(--mut);line-height:1.25}
.tile .tv{font-size:26px;font-weight:700;margin:2px 0}
.tile .tv small{font-size:13px;font-weight:400;color:var(--mut)}
.td{font-size:13px}.td.good{color:#86efac}.td.bad{color:#fcd34d}.td.neu{color:var(--mut)}
.dg{color:#86efac}.dbd{color:#fcd34d}
.ins{display:flex;gap:10px;padding:8px 0 8px 10px;border-left:3px solid var(--line);margin:6px 0;font-size:14px}
.ins b{font-size:18px;line-height:1.2}
.ins.ok{border-color:var(--ok)}.ins.warn{border-color:var(--warn)}.ins.bad{border-color:var(--bad)}
.chart{display:block;width:100%;height:auto;touch-action:manipulation}
.ax{fill:var(--mut);font-size:11px;font-family:inherit}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);margin:2px 0 8px}
.lg i{display:inline-block;vertical-align:middle;margin-right:6px}
.lg i.line{width:16px;height:3px;border-radius:2px}
.lg i.rect,.lg i.sq{width:10px;height:10px;border-radius:3px}
.lg i.dot{width:9px;height:9px;border-radius:50%}
.lg i.bk{width:14px;height:10px;border-radius:2px;background:rgba(34,197,94,.22)}
.sq.ok{background:#11351f;border:1px solid #2f7a49}.sq.warn{background:#3a2a0b;border:1px solid #8a6514}.sq.bad{background:#3b1520;border:1px solid #8a2a3d}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
td{white-space:nowrap}td:first-child{white-space:normal}
th{color:var(--mut);font-weight:500;font-size:12px}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
table.tg input{padding:7px 6px;font-size:15px;text-align:center}
table.tg td{padding:4px}
table.tg td:first-child{white-space:nowrap;font-size:14px}
table.tg td+td{width:84px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat.hd{margin-bottom:5px}
.heat.hd span{text-align:center;font-size:11px;color:var(--mut)}
.heat div{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;background:#1a2540;color:var(--mut);cursor:pointer;line-height:1.15}
.heat div b{font-size:13px;font-weight:600}
.heat div small{font-size:10px}
.heat div.ok{background:#11351f;color:#86efac}.heat div.warn{background:#3a2a0b;color:#fcd34d}.heat div.bad{background:#3b1520;color:#fca5a5}
.heat div.fut{opacity:.35;cursor:default}
.heat div.now{outline:2px solid var(--ac)}
.heat .na{background:transparent;cursor:default}
#tip{position:fixed;z-index:50;background:#e8eefc;color:#0b1220;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.35;white-space:pre-line;pointer-events:none;opacity:0;transition:opacity .15s;max-width:250px;box-shadow:0 6px 20px rgba(0,0,0,.45);left:0;top:0}
#tip.on{opacity:1}
.guide{margin:0;padding-left:20px;font-size:14px}
.guide li{margin:7px 0}
.fi{display:flex;gap:6px;align-items:center;padding:8px 10px;background:var(--card2);border-radius:12px;margin-top:6px}
.fi .fq{width:54px;padding:7px 2px;text-align:center;font-weight:700}
.fi .btn{min-width:38px}
.nf{background:#0e1626;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:6px}
.nf label{margin-top:8px}
input[readonly]{opacity:.7}
.chip .cn{display:inline-block;background:#04201d;color:var(--ac);border-radius:99px;padding:0 6px;margin-left:4px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header><div><h1 id="ttl">Бугун</h1><div class="d" id="hdate"></div></div><button class="btn p sm" onclick="openReading()">＋ Қанд</button></header>
  <main id="main"></main>
</div>

<nav>
  <button data-t="today" class="on" onclick="tab('today')"><b>🩸</b>Бугун</button>
  <button data-t="log" onclick="tab('log')"><b>📖</b>Журнал</button>
  <button data-t="stats" onclick="tab('stats')"><b>📊</b>Таҳлил</button>
  <button data-t="set" onclick="tab('set')"><b>⚙️</b>Созлама</button>
</nav>

<div class="modal" id="mdl" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>

<div class="ring-alert" id="ra">
  <div class="pill">🩸</div>
  <h2 id="raT" style="font-size:24px;margin:10px 0 6px"></h2>
  <div id="raD" class="mut" style="font-size:16px;margin-bottom:22px;max-width:360px"></div>
  <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px">
    <button class="btn p full" style="padding:16px;font-size:18px" onclick="raAct('enter')">✍️ Ҳозир киритаман</button>
    <button class="btn full" onclick="raAct('snooze')">⏰ 10 дақиқадан кейин</button>
    <button class="btn bad full" onclick="raAct('skip')">✖ Ўтказиб юбориш</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="tip"></div>
<input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importData(this)">

<script>
/* ================= Маълумотлар ================= */
const KEY='qand_nazorati_v1',DORI_KEY='dori_vaqti_v1';
const MIN=6e4,HOUR=36e5,DAY=864e5;
const WD=['Якшанба','Душанба','Сешанба','Чоршанба','Пайшанба','Жума','Шанба'];
const WDS=['Як','Ду','Се','Чо','Па','Жу','Ша'];
const MON=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const TAGS={
  fast:{n:'Наҳорги',l:'Эрталаб наҳорда',i:'🌅'},
  pre:{n:'Овқатдан олдин',l:'Овқатдан олдин',i:'🍽'},
  p30:{n:'30 дақ кейин',l:'Овқатдан 30 дақиқа кейин',i:'⏱',m:30},
  p60:{n:'1 соат кейин',l:'Овқатдан 1 соат кейин',i:'⏱',m:60},
  p120:{n:'2 соат кейин',l:'Овқатдан 2 соат кейин',i:'⏱',m:120},
  p180:{n:'3 соат кейин',l:'Овқатдан 3 соат кейин',i:'⏱',m:180},
  spre:{n:'Спортдан олдин',l:'Спортдан олдин',i:'🏃'},
  spost:{n:'Спортдан кейин',l:'Спортдан кейин',i:'🏃'},
  bed:{n:'Ухлашдан олдин',l:'Ухлашдан олдин',i:'🌙'},
  other:{n:'Бошқа',l:'Бошқа вақтда',i:'🩸'}
};
const TAG_GROUPS=[['fast','pre'],['p30','p60','p120','p180'],['spre','spost'],['bed','other']];
const POST=['p30','p60','p120','p180'];
const SLOT={30:'30 дақиқа',60:'1 соат',120:'2 соат',180:'3 соат'};
const MEALT={b:{n:'Нонушта',i:'🍳'},l:{n:'Тушлик',i:'🍲'},d:{n:'Кечки овқат',i:'🍽'},s:{n:'Газак',i:'🍎'}};
const SPORTS={walk:{n:'Юриш',i:'🚶',met:3.5},fwalk:{n:'Тез юриш',i:'👟',met:4.8},run:{n:'Югуриш',i:'🏃',met:9},bike:{n:'Велосипед',i:'🚴',met:7},swim:{n:'Сузиш',i:'🏊',met:7},gym:{n:'Куч машқлари',i:'🏋️',met:5},cardio:{n:'Кардио',i:'🫀',met:7},ball:{n:'Футбол',i:'⚽',met:7},yoga:{n:'Чўзилиш, йога',i:'🧘',met:2.5},other:{n:'Бошқа',i:'➕',met:4}};
const INT={1:{n:'Енгил',k:.8},2:{n:'Ўртача',k:1},3:{n:'Юқори',k:1.25}};
const C={blue:'#3987e5',orange:'#d95926',aqua:'#199e70',yellow:'#c98500',gray:'#5d6b88',grid:'#24304d',surf:'#131c2e',ok:'#22c55e',warn:'#f59e0b',bad:'#ef4444'};
// Стандарт мақсадлар (ммоль/л): ADA тавсияси — овқатдан олдин 4.4–7.2, овқатдан кейин энг юқори <10.0
const DEF_TG={fast:[4.4,7.2],pre:[4.4,7.2],p30:[3.9,10],p60:[3.9,10],p120:[3.9,10],p180:[3.9,7.8],spre:[3.9,10],spost:[3.9,10],bed:[4.4,10],other:[3.9,10]};

function defSet(){return{unit:'mmol',src:'meter',remind:[30,60,180],tg:JSON.parse(JSON.stringify(DEF_TG)),low:3.9,vhigh:13.9,kcalGoal:0,weight:0,notif:true,sound:true,vibrate:true,fullAlert:true,dori:true,lastSport:'run',fastTime:'07:00',lastBackup:0}}
const FUNITS=['дона','порция','коса','бўлак','стакан','қошиқ','100 г'],HALF=['порция','коса','стакан','100 г'];
// Бошланғич рўйхат (1 дона/порция учун: ккал, углевод г, шакар г) — тахминий, фойдаланувчи ўзгартиради
const DEF_FOODS=[['Тухум (қайнатилган)','дона',75,0.5,0.5],['Товуқ оёқчаси','дона',160,0,0],['Нон (1/4 та)','бўлак',190,37,2],['Палов','порция',600,65,3],['Мастава','коса',320,35,4],['Шўрва','коса',300,15,3],['Лағмон','порция',550,70,5],['Манти','дона',90,9,0.5],['Сомса','дона',300,28,1],['Олма','дона',80,21,16],['Чой (шакарсиз)','стакан',2,0,0],['Шакар','қошиқ',20,5,5]];
function def(){return{v:1,readings:[],meals:[],sports:[],meds:[],tpl:[],medList:[],rem:[],burn:{},foods:DEF_FOODS.map((a,i)=>({id:'f'+i,name:a[0],unit:a[1],kcal:a[2],carbs:a[3],sugar:a[4],n:0})),settings:defSet()}}
function norm(d){const b=def(),o={...b,...d};o.settings={...b.settings,...(d.settings||{})};o.settings.tg={...b.settings.tg,...((d.settings||{}).tg||{})};
  ['readings','meals','sports','meds','tpl','medList','rem','foods'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});
  if(!Array.isArray(o.settings.remind))o.settings.remind=[30,60,180];
  if(!o.burn||typeof o.burn!=='object'||Array.isArray(o.burn))o.burn={};
  o.rem=o.rem.filter(r=>!r.done&&Date.now()-r.due<DAY);return o}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.readings))return norm(d)}catch(e){}return def()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ Сақлашда хато!')}}
const UI={tab:'today',sm:'week',sa:Date.now(),logF:'all',logDays:14};
let F={};

/* ================= Ёрдамчилар ================= */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const addD=(t,n)=>{const d=new Date(t);d.setDate(d.getDate()+n);return d.getTime()};
const sow=t=>{const d=new Date(sod(t));d.setDate(d.getDate()-(d.getDay()+6)%7);return d.getTime()};
const som=t=>{const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),1).getTime()};
const addM=(t,n)=>{const d=new Date(som(t));d.setMonth(d.getMonth()+n);return d.getTime()};

function ago(t){const m=Math.round((Date.now()-t)/MIN);if(m<1)return'ҳозиргина';if(m<60)return m+' дақ олдин';

function curve(m){const rs=mealR(m).sort((a,b)=>a.ts-b.ts),g=t=>rs.find(r=>r.tag===t)||null;
  const c={pre:g('pre')||g('fast'),p30:g('p30'),p60:g('p60'),p120:g('p120'),p180:g('p180')};
  const ps=POST.map(t=>c[t]).filter(Boolean);
  if(ps.length){const k=ps.reduce((a,b)=>b.v>a.v?b:a);c.peak=k.v;c.peakTag=k.tag}
  if(c.pre&&c.peak!=null)c.rise=c.peak-c.pre.v;

  return c}
function fastOf(t){const s=sod(t),e=addD(s,1);const r=S.readings.filter(x=>x.tag==='fast'&&x.ts>=s&&x.ts<e).sort((a,b)=>a.ts-b.ts)[0];return r?r.v:null}
function peakOf(t){const s=sod(t),e=addD(s,1);const v=S.readings.filter(x=>POST.includes(x.tag)&&x.ts>=s&&x.ts<e).map(r=>r.v);return v.length?Math.max(...v):null}
function stats(s,e){
  const R=inR(S.readings,s,e),M=inR(S.meals,s,e),SP=inR(S.sports,s,e),vals=R.map(r=>r.v);

  const fast={};R.filter(r=>r.tag==='fast').sort((a,b)=>a.ts-b.ts).forEach(r=>{const k=dk(r.ts);if(!(k in fast))fast[k]=r.v});
  const curves=M.map(m=>({m,c:curve(m)}));
  const rises=curves.map(x=>x.c.rise).filter(x=>x!=null),peaks=curves.map(x=>x.c.peak).filter(x=>x!=null);
  const sts=R.map(r=>st(r.v,r.tag));
  const kIn=sum(M.map(m=>m.kcal||0)),kOut=sum(SP.map(x=>x.kcal||0)),kDays=new Set(M.filter(m=>m.kcal).map(m=>dk(m.ts))).size;
  return{s,e,R,M,SP,n:R.length,avg:mean(vals),min:vals.length?Math.min(...vals):null,max:vals.length?Math.max(...vals):null,by,avgBy,
    fast,fastAvg:mean(Object.values(fast)),fastN:Object.keys(fast).length,curves,riseAvg:mean(rises),peakAvg:mean(peaks),
    tir:R.length?sts.filter(x=>x==='ok').length/R.length*100:null,low:sts.filter(x=>x==='low').length,vhigh:sts.filter(x=>x==='vhigh').length,
    kIn,kOut,kDays,kInAvg:kDays?kIn/kDays:null,sDays:new Set(SP.map(x=>dk(x.ts))).size,sMin:sum(SP.map(x=>x.dur||0)),
    mDays:new Set(R.map(r=>dk(r.ts))).size,unusualN:M.filter(m=>m.unusual).length,...burnSt(s,e,M)}}
function burnSt(s,e,M){let bT=0,bN=0,balT=0,balN=0;for(let t=sod(s);t<e;t=addD(t,1)){const b=S.burn[dk(t)];if(!b)continue;bT+=b;bN++;const ki=sum(inR(M,t,addD(t,1)).map(m=>m.kcal||0));if(ki){balT+=ki-b;balN++}}
  return{burn:bT,bN,bAvg:bN?bT/bN:null,bal:balN?balT/balN:null,balN}}
const sgn=x=>(Math.round(x)>0?'+':Math.round(x)<0?'−':'')+fk(Math.abs(x));
const balTxt=b=>Math.abs(b)<=150?'⚖️ Мувозанатда — вазн ўзгармайди':b<0?'⬇️ Сарф кўпроқ — вазн тушиши мумкин':'⬆️ Истеъмол кўпроқ — вазн ошиши мумкин';
function grp(cs){return{n:cs.length,rise:mean(cs.filter(c=>c.rise!=null).map(c=>c.rise)),peak:mean(cs.filter(c=>c.peak!=null).map(c=>c.peak)),p180:mean(cs.filter(c=>c.p180).map(c=>c.p180.v))}}
function cmpUsual(A){const u=[],x=[];A.curves.forEach(({m,c})=>{if(c.peak==null)return;(m.unusual?x:u).push(c)});return{u:grp(u),x:grp(x)}}
function sportDrops(A){return A.SP.map(s=>{const rs=S.readings.filter(r=>r.sportId===s.id),a=rs.find(r=>r.tag==='spre'),b=rs.find(r=>r.tag==='spost');return a&&b?{s,pre:a.v,post:b.v,d:b.v-a.v}:null}).filter(Boolean)}

function nextFast(A){const w=[],wo=[];for(let t=A.s;t<A.e;t=addD(t,1)){const v=fastOf(addD(t,1));if(v==null)continue;(S.sports.some(x=>x.ts>=t&&x.ts<addD(t,1))?w:wo).push(v)}return{w:mean(w),nw:w.length,wo:mean(wo),nwo:wo.length}}
function foodRank(A){const g={};A.curves.forEach(({m,c})=>{if(c.rise==null)return;const n=String(m.name||'').trim();if(!n)return;const k=n.toLowerCase();(g[k]=g[k]||{name:n,r:[]}).r.push(c.rise)});
  return Object.values(g).map(x=>({name:x.name,n:x.r.length,rise:mean(x.r)})).sort((a,b)=>b.rise-a.rise)}
function corr(x,y){const n=x.length;if(n<3)return null;const mx=mean(x),my=mean(y);let a=0,b=0,c=0;for(let i=0;i<n;i++){const dx=x[i]-mx,dy=y[i]-my;a+=dx*dy;b+=dx*dx;c+=dy*dy}return b&&c?a/Math.sqrt(b*c):null}

/* «Дори вақти» иловасидаги «ичдим» белгилари (шу сайтда бўлса) */
function doriData(){if(!S.settings.dori)return null;try{const d=JSON.parse(localStorage.getItem(DORI_KEY));if(d&&Array.isArray(d.meds)&&d.log&&typeof d.log==='object')return d}catch(e){}return null}
function doriEvents(s,e){const d=doriData();if(!d)return[];const out=[],M={};d.meds.forEach(m=>{if(m&&m.id)M[m.id]=m});
  for(const date in d.log){const p=date.split('-').map(Number);if(p.length!==3)continue;const day=new Date(p[0],p[1]-1,p[2]).getTime();if(day<sod(s)-DAY||day>=e)continue;
    const L=d.log[date]||{};for(const key in L){const it=L[key];if(!it||it.s!=='taken')continue;const[id,tm]=key.split('|');const[h,mi]=String(tm||'0:0').split(':').map(Number);
      const sch=new Date(p[0],p[1]-1,p[2],h||0,mi||0).getTime(),ts=it.t&&Math.abs(it.t-sch)<12*HOUR?it.t:sch;if(ts<s||ts>=e)continue;
      const m=M[id];out.push({id:'d'+date+key,ts,name:m?m.name:'Дори',dose:m?m.dose||'':'',src:'dori'})}}
  return out}
function medEvents(s,e){const own=inR(S.meds,s,e).map(x=>({...x,src:'own'})),nm=x=>String(x||'').trim().toLowerCase(),res=[...own];
  doriEvents(s,e).forEach(d=>{if(!own.some(o=>nm(o.name)===nm(d.name)&&Math.abs(o.ts-d.ts)<HOUR))res.push(d)});return res.sort((a,b)=>a.ts-b.ts)}
function medCmp(A){if(!medEvents(addD(A.s,-60),A.e).length)return null;const w=[],wo=[];
  for(let t=A.s;t<A.e&&t<=Date.now();t=addD(t,1)){const X=stats(t,addD(t,1));if(!X.n)continue;(medEvents(t,addD(t,1)).length?w:wo).push(X)}
  const g=a=>({n:a.length,avg:mean(a.map(x=>x.avg)),fast:mean(a.filter(x=>x.fastAvg!=null).map(x=>x.fastAvg))});return{w:g(w),wo:g(wo)}}

/* ================= Эслатмалар ================= */
function allPend(now=Date.now()){const out=[];
  for(const m of S.meals){if(m.noRem||now-m.ts>6*HOUR||m.ts>now+HOUR)continue;const have=mealR(m).map(r=>r.tag);
    const maxHave=Math.max(0,...have.filter(t=>POST.includes(t)).map(t=>TAGS[t].m));
    for(const min of S.settings.remind){const tag='p'+min;if(have.includes(tag)||(m.skip||[]).includes(tag)||min<maxHave)continue;
      const due=m.ts+min*MIN;if(now>due+(min>=180?90:60)*MIN)continue;out.push({kind:'slot',key:m.id+'|'+tag,m,tag,min,due,overdue:now>=due})}}
  for(const r of S.rem){if(r.done||now>r.due+60*MIN)continue;out.push({kind:'rem',key:'r|'+r.id,r,due:r.due,overdue:now>=r.due,title:r.title})}
  return out.sort((a,b)=>a.due-b.due)}
const pFired=p=>p.kind==='slot'?(p.m.fired||{})[p.tag]:p.kind==='rem'?p.r.fired:0;
const pSnz=p=>p.kind==='slot'?(p.m.snz||{})[p.tag]:p.kind==='rem'?p.r.snz:0;
function setFired(p,v){if(p.kind==='slot'){p.m.fired=p.m.fired||{};p.m.fired[p.tag]=v}else if(p.kind==='rem')p.r.fired=v}
function setSnz(p,v){if(p.kind==='slot'){p.m.snz=p.m.snz||{};if(v)p.m.snz[p.tag]=v;else delete p.m.snz[p.tag]}else if(p.kind==='rem')p.r.snz=v||0}
function pTitle(p){return p.kind==='slot'?`${MEALT[p.m.type].n}дан ${SLOT[p.min]} ўтди (${hm(p.m.ts)})`:p.title||'Қандни ўлчанг'}
function cdTxt(due){const d=due-Date.now();return d>0?dur(d)+' қолди':(-d<2*MIN?'⏰ Вақти бўлди!':'⏰ '+dur(-d)+' ўтди')}
let lastSig='';
function tick(){const now=Date.now(),P=allPend(now),fire=[];
  for(const p of P){if(!p.overdue)continue;const z=pSnz(p);if(z){if(now>=z){setSnz(p,0);fire.push(p)}continue}if(!pFired(p))fire.push(p)}
  if(fire.length){fire.forEach(p=>setFired(p,now));save();fireAlert(fire[fire.length-1])}
  document.querySelectorAll('[data-due]').forEach(el=>el.textContent=cdTxt(+el.dataset.due));
  const sig=P.map(p=>p.key+(p.overdue?1:0)).join(',');if(sig!==lastSig){lastSig=sig;if(UI.tab==='today'&&!sheetOpen)render()}}
function fireAlert(p){const t='🩸 Қанд ўлчаш вақти',b=p.kind==='slot'?pTitle(p)+'. Қандни ўлчаб, киритинг.':pTitle(p)+'.';
  notify(t,b,p);if(S.settings.vibrate&&navigator.vibrate)try{navigator.vibrate([400,150,400,150,400])}catch(e){}beep();
  if(document.visibilityState!=='visible')return;if(S.settings.fullAlert&&!sheetOpen)showRa(p,t,b);else toast('⏰ '+b)}
let SWR=null,AC=null,raCur=null,raBeep=null;
if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').then(r=>SWR=r).catch(()=>{});
  navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='qand-open')handleKey(e.data.k)})}

  try{const reg=SWR||(navigator.serviceWorker&&await navigator.serviceWorker.getRegistration());if(reg){await reg.showNotification(title,opt);return}}catch(e){}

function unlockAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}

  [0,.32,.64].forEach((d,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=i===2?1175:880;
    g.gain.setValueAtTime(.0001,t0+d);g.gain.exponentialRampToValueAtTime(.35,t0+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.28);
    o.connect(g);g.connect(AC.destination);o.start(t0+d);o.stop(t0+d+.3)})}catch(e){}}

function CW(){const w=($('.wrap')||document.body).clientWidth;return Math.max(260,Math.min(700,w-58))}
function ticks(lo,hi,mx=6){if(hi-lo<1e-9)hi=lo+1;let mag=Math.pow(10,Math.floor(Math.log10((hi-lo)/mx))),step=mag;
  for(const m of[1,2,5,10,20]){step=m*mag;if(Math.ceil(hi/step-1e-9)-Math.floor(lo/step+1e-9)<=mx)break}
  const a=Math.floor(lo/step+1e-9)*step,b=Math.ceil(hi/step-1e-9)*step,t=[];
  for(let v=a;v<=b+step*1e-6;v+=step)t.push(Math.round(v*1e6)/1e6);return{t,lo:a,hi:b}}
const fa=v=>Number.isInteger(v)?String(v):v.toFixed(1);
const bandU=()=>[toU(S.settings.low),toU(S.settings.tg.p60[1])];
const nodata=()=>'<div class="mut" style="padding:18px 0;text-align:center">Маълумот етарли эмас</div>';
function legend(items,kind='line',band=true){return`<div class="lg">${items.map(([c,n])=>`<span><i class="${kind}" style="background:${c}"></i>${n}</span>`).join('')}${band?'<span><i class="bk"></i>мақсад оралиғи</span>':''}</div>`}
function lineChart(o){const W=CW(),mk=o.marks&&o.marks.length,H=(o.h||210)+(mk?16:0),P={l:34,r:12,t:12,b:mk?62:28},pw=W-P.l-P.r,ph=H-P.t-P.b;
  const ys=[];o.series.forEach(s=>s.pts.forEach(p=>{if(p&&p.y!=null)ys.push(p.y)}));if(!ys.length)return nodata();if(o.band)ys.push(...o.band);
  const lo=Math.min(...ys),hi=Math.max(...ys),pd=(hi-lo)*.04||1,T=ticks(lo-pd,hi+pd,6);
  const X=v=>P.l+(v-o.x.min)/((o.x.max-o.x.min)||1)*pw,Y=v=>P.t+ph-(v-T.lo)/((T.hi-T.lo)||1)*ph;let g='';
  if(o.band){const y1=Y(Math.min(o.band[1],T.hi)),y0=Y(Math.max(o.band[0],T.lo));g+=`<rect x="${P.l}" y="${y1.toFixed(1)}" width="${pw}" height="${Math.max(0,y0-y1).toFixed(1)}" fill="${C.ok}" opacity=".1"/>`}
  T.t.forEach(t=>{const y=Y(t).toFixed(1);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="${C.grid}" stroke-width="1"/><text x="${P.l-6}" y="${(+y+4).toFixed(1)}" text-anchor="end" class="ax">${fa(t)}</text>`});
  o.x.ticks.forEach(t=>{const x=X(t.v),hw=String(t.l).length*3.2,an=x-hw<2?'start':x+hw>W-2?'end':'middle',xx=an==='start'?Math.max(2,x-hw):an==='end'?Math.min(W-2,x+hw):x;

function pendCard(P){const g={};P.forEach(p=>{const k=p.kind==='slot'?p.m.id:'rem';(g[k]=g[k]||[]).push(p)});let h='<div class="card"><h3>⏰ Кейинги ўлчовлар</h3>';

function rangeOf(mode,a){if(mode==='day'){const s=sod(a);return[s,addD(s,1)]}if(mode==='week'){const s=sow(a);return[s,addD(s,7)]}const s=som(a);return[s,addM(s,1)]}

  const d=new Date(s);return cap(MON[d.getMonth()])+' '+d.getFullYear()}

function dlt(a,b,better='down',fmt='v'){if(a==null||b==null)return'<div class="td neu">—</div>';const d=a-b,z=fmt==='v'?qv(d):Math.round(d);
  if(z===0)return'<div class="td neu">= ўзгармади</div>';const up=z>0,cls=better==='none'?'neu':(better==='up'?up:!up)?'good':'bad';
  const txt=fmt==='p'?Math.abs(z)+'%':fmt==='k'?fk(Math.abs(z))+' ккал':fv(Math.abs(d));return`<div class="td ${cls}">${up?'▲':'▼'} ${txt}</div>`}
const tile=(l,v,u,d)=>`<div class="tile"><div class="tl">${l}</div><div class="tv">${v}${u?`<small> ${u}</small>`:''}</div>${d||''}</div>`;

function insightsHtml(A,B){const L=[],per={day:'кечага',week:'ўтган ҳафтага',month:'ўтган ойга'}[UI.sm],thr=isMg()?5:.3,sig=d=>Math.abs(toU(d))>=thr;

  if(A.vhigh)L.push(['‼️',`${A.vhigh} марта қанд жуда юқори бўлган (${fv(S.settings.vhigh)} ва ундан юқори).`,'bad']);

  else if(A.fastAvg!=null)L.push(['🌅',`Наҳорги қанд ${UI.sm==='day'?'':'ўртача '}${fv(A.fastAvg)} ${U()}.`,st(A.fastAvg,'fast')==='ok'?'ok':'warn']);
  if(A.peakAvg!=null&&B.peakAvg!=null){const d=A.peakAvg-B.peakAvg;if(sig(d))L.push([d<0?'📉':'📈',`Овқатдан кейинги энг юқори қанд ${per} нисбатан ${fv(Math.abs(d))} га ${d<0?'пасайди':'ошди'}: ${fv(B.peakAvg)} → ${fv(A.peakAvg)}.`,d<0?'ok':'warn'])}
  if(A.tir!=null&&A.n>=3)L.push(['🎯',`Ўлчовларнинг ${Math.round(A.tir)}% мақсад оралиғида.`,A.tir>=70?'ok':'warn']);
  const pt=POST.filter(t=>A.by[t].length>=2);if(pt.length>=2){const k=pt.reduce((a,b)=>A.avgBy[b]>A.avgBy[a]?b:a);L.push(['⏱',`Қанд кўпинча овқатдан ${SLOT[TAGS[k].m]} кейин энг юқори бўляпти (ўртача ${fv(A.avgBy[k])}).`,'i'])}
  const bk=A.curves.filter(x=>x.c.back!=null);if(bk.length>=2){const k=bk.filter(x=>x.c.back).length,ok=k/bk.length>=.7;L.push([ok?'✅':'⚠️',`${bk.length} та овқатнинг ${k} тасида қанд 3 соатда олдинги даражасига қайтди.`,ok?'ok':'warn'])}
  const u=cmpUsual(A);if(u.u.rise!=null&&u.x.rise!=null)L.push(['⚡',`Ноодатий овқатдан кейин қанд ўртача ${fd(u.x.rise)} кўтарилди, одатийда — ${fd(u.u.rise)}.`,u.x.rise-u.u.rise>=1?'warn':'i']);
  const sd=sportDrops(A);if(sd.length){const d=mean(sd.map(x=>x.d));L.push(['🏃',d<0?`Спорт қандни ўртача ${fv(-d)} га туширди (${sd.length} та машғулот).`:`Спортдан кейин қанд ўртача ${fv(d)} га ошди (${sd.length} та машғулот) — жадал машқда шундай бўлиши мумкин.`,d<0?'ok':'i'])}
  const nf=nextFast(A);if(nf.nw>=2&&nf.nwo>=2&&sig(nf.w-nf.wo))L.push(['🌅',`Спорт қилинган кунлардан кейинги эрталаб наҳорги қанд ўртача ${fv(Math.abs(nf.w-nf.wo))} га ${nf.w<nf.wo?'паст':'юқори'} бўлди.`,nf.w<nf.wo?'ok':'i']);
  const pm=postMealSport(A);if(pm.w.n>=2&&pm.wo.n>=2&&pm.w.p180!=null&&pm.wo.p180!=null&&sig(pm.w.p180-pm.wo.p180))L.push(['🍽',`Овқатдан кейин спорт қилганда 3 соатдаги қанд ўртача ${fv(Math.abs(pm.w.p180-pm.wo.p180))} га ${pm.w.p180<pm.wo.p180?'паст':'юқори'} бўлди.`,pm.w.p180<pm.wo.p180?'ok':'i']);
  const cp=A.curves.filter(x=>x.m.kcal&&x.c.rise!=null);if(cp.length>=6){const r=corr(cp.map(x=>x.m.kcal),cp.map(x=>x.c.rise));if(r!=null)L.push(r>=.5?['🔥','Калорияси кўп овқатлардан кейин қанд кўпроқ кўтарилган (боғлиқлик кучли).','warn']:r>=.3?['🔥','Калория ошган сари қанд кўтарилиши ҳам бироз ошяпти.','i']:['🔥','Калория миқдори билан қанд кўтарилиши орасида аниқ боғлиқлик кўринмаяпти — овқат таркиби (углевод) муҳимроқ бўлиши мумкин.','i'])}
  if(A.balN>=(UI.sm==='day'?1:3))L.push(['⚖️',Math.abs(A.bal)<=150?`Истеъмол ва сарф мувозанатда (ўртача ${sgn(A.bal)} ккал кунига).`:`Ўртача кунига ${fk(Math.abs(A.bal))} ккал ${A.bal<0?'кам ейилди — вазн тушиши мумкин':'кўп ейилди — вазн ошиши мумкин'}.`,Math.abs(A.bal)<=150?'ok':'i']);

  if(UI.sm!=='day'){const el=Math.max(1,Math.round((Math.min(A.e,addD(sod(Date.now()),1))-A.s)/DAY));if(A.fastN<el)L.push(['📝',`Наҳорги қанд ${el} кундан ${A.fastN} кунида ўлчанган. Ҳар куни ўлчасангиз, таҳлил аниқроқ бўлади.`,'i'])}

  if(!L.length)L.push(['ℹ️','Хулоса чиқариш учун маълумот ҳали кам. Ўлчовларни киритишда давом этинг.','i']);
  return`<div class="card"><h3>💡 Хулосалар</h3>${L.map(([i,t,c])=>`<div class="ins ${c}"><b>${i}</b><div>${t}</div></div>`).join('')}<div class="mut" style="font-size:12px;margin-top:8px">Бу — кузатув натижалари. Даволаш ва дори бўйича қарорни шифокор билан қабул қилинг.</div></div>`}

function weekDetail(A,B){return`<div class="card"><h3>📈 Кунлар бўйича</h3>${daysChart(A)}</div>`+curveCard(A,B,'Бу ҳафта','Ўтган ҳафта')+slotTable(A,B)+kcalBars(A)+compareCard(A)+foodCard(A)+scatterCard(A)}
function monthDetail(A,B){return calCard(A)+`<div class="card"><h3>📈 Ой давомида ўзгариш</h3>${monthTrend(A)}</div>`+curveCard(A,B,'Бу ой','Ўтган ой')+weeksTable(A)+slotTable(A,B)+trend12()+kcalBars(A)+compareCard(A)+foodCard(A)+scatterCard(A)}
function daysChart(A){const days=[];for(let t=A.s;t<A.e;t=addD(t,1))days.push(t);

function kcalBars(A){const days=[];for(let t=A.s;t<A.e;t=addD(t,1))days.push(t);const hasB=A.bN>0;

    return{l:days.length>7?String(new Date(t).getDate()):WDS[new Date(t).getDay()],v:[i,o],tip:`${dLong(t)}\nИстеъмол: ${fk(i)} ккал\n${hasB?'Кунлик сарф: '+(b?fk(b)+' ккал':'киритилмаган'):'Спорт сарфи: '+fk(sp)+' ккал'}${hasB&&b&&i?'\nБаланс: '+sgn(i-b):''}`}});
  if(!cats.some(c=>c.v[0]||c.v[1]))return'';
  const top=hasB?`${kc('Истеъмол',fk(A.kInAvg))}${kc('Сарф',fk(A.bAvg))}${kc('Баланс',A.bal!=null?sgn(A.bal):'—')}`:`${kc('Жами истеъмол',fk(A.kIn))}${kc('Спорт сарфи',fk(A.kOut))}${kc('Кунига ўртача',fk(A.kInAvg))}`;
  return`<div class="card"><h3>🔥 Калория (ккал${hasB?', кунига ўртача':''})</h3><div class="g3 kc">${top}</div>${hasB&&A.bal!=null?`<div class="mut" style="font-size:13px;margin-top:6px">${balTxt(A.bal)} (${A.balN} кун бўйича)</div>`:hasB?'':'<div class="mut" style="font-size:12px;margin-top:6px">Кунлик жами сарфни (WHOOP) киритсангиз, истеъмол билан солиштирилади.</div>'}<div style="height:10px"></div>${legend([[C.yellow,'Истеъмол'],[C.aqua,hasB?'Кунлик сарф':'Спорт сарфи']],'rect',false)}${barChart({cats,colors:[C.yellow,C.aqua],ref:S.settings.kcalGoal||0})}</div>`}
function compareCard(A){let h='';const u=cmpUsual(A);
  if(u.x.n||u.u.n&&u.x.n)h+=`<h4>🍽 Одатий ва ноодатий овқат</h4><table><tr><th></th><th>Сони</th><th>Кўтарилиш</th><th>Энг юқори</th><th>3 соатда</th></tr>${[['✅ Одатий',u.u],['⚡ Ноодатий',u.x]].map(([n,o])=>`<tr><td>${n}</td><td>${o.n}</td><td>${fd(o.rise)}</td><td>${fv(o.peak)}</td><td>${fv(o.p180)}</td></tr>`).join('')}</table>`;
  const sd=sportDrops(A);if(sd.length){const g={};sd.forEach(x=>{(g[x.s.type]=g[x.s.type]||[]).push(x)});const rows=Object.entries(g).map(([k,a])=>[(SPORTS[k]||SPORTS.other).i+' '+(SPORTS[k]||SPORTS.other).n,a]);if(rows.length>1)rows.push(['Жами',sd]);
    h+=`<h4>🏃 Спортдан олдин → кейин</h4><table><tr><th>Тури</th><th>Сони</th><th>Олдин</th><th>Кейин</th><th>Фарқи</th></tr>${rows.map(([n,a])=>`<tr><td>${n}</td><td>${a.length}</td><td>${fv(mean(a.map(x=>x.pre)))}</td><td>${fv(mean(a.map(x=>x.post)))}</td><td><b>${fd(mean(a.map(x=>x.d)))}</b></td></tr>`).join('')}</table>`}
  const pm=postMealSport(A);if(pm.w.n&&pm.wo.n)h+=`<h4>🍽→🏃 Овқатдан кейинги 3 соатда спорт</h4><table><tr><th></th><th>Сони</th><th>Кўтарилиш</th><th>Энг юқори</th><th>3 соатда</th></tr>${[['Спорт билан',pm.w],['Спортсиз',pm.wo]].map(([n,o])=>`<tr><td>${n}</td><td>${o.n}</td><td>${fd(o.rise)}</td><td>${fv(o.peak)}</td><td>${fv(o.p180)}</td></tr>`).join('')}</table>`;
  const nf=nextFast(A);if(nf.nw&&nf.nwo)h+=`<h4>🌅 Эртасига наҳорги қанд</h4><table><tr><th></th><th>Кунлар</th><th>Наҳорги</th></tr><tr><td>Спорт қилинган кундан кейин</td><td>${nf.nw}</td><td><b>${fv(nf.w)}</b></td></tr><tr><td>Спортсиз кундан кейин</td><td>${nf.nwo}</td><td><b>${fv(nf.wo)}</b></td></tr></table>`;
  const md=medCmp(A);if(md&&md.w.n&&md.wo.n)h+=`<h4>💊 Дори</h4><table><tr><th></th><th>Кунлар</th><th>Ўртача</th><th>Наҳорги</th></tr><tr><td>Дори ичилган кунлар</td><td>${md.w.n}</td><td>${fv(md.w.avg)}</td><td>${fv(md.w.fast)}</td></tr><tr><td>Ичилмаган кунлар</td><td>${md.wo.n}</td><td>${fv(md.wo.avg)}</td><td>${fv(md.wo.fast)}</td></tr></table>`;
  if(!h)return'';return`<div class="card"><h3>⚖️ Нима таъсир қиляпти?</h3>${h}<div class="mut" style="font-size:12px;margin-top:8px">Сони 3 тадан кам бўлса, натижа тахминий. Ҳамма қийматлар — ${U()}.</div></div>`}
function foodCard(A){const r=foodRank(A);if(!r.length)return'';
  return`<div class="card"><h3>🍚 Таомлар: қанд қанча кўтарилди</h3><table><tr><th>Таом</th><th>Марта</th><th>Кўтарилиш</th></tr>${r.slice(0,8).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.n}</td><td><b>${fd(x.rise)}</b></td></tr>`).join('')}</table><div class="mut" style="font-size:12px;margin-top:6px">Кўтарилиш = овқатдан кейинги энг юқори қанд − овқатдан олдинги қанд. Ҳисобланиши учун овқатдан олдин ҳам ўлчанг.</div></div>`}
function scatterCard(A){const pts=A.curves.filter(({m,c})=>m.kcal&&c.rise!=null).map(({m,c})=>({x:m.kcal,y:toU(c.rise),u:!!m.unusual,tip:`${m.name||MEALT[m.type].n}\n${fk(m.kcal)} ккал · кўтарилиш ${fd(c.rise)}`}));
  if(pts.length<4)return'';const r=corr(pts.map(p=>p.x),pts.map(p=>p.y)),rt=r==null?'—':Math.abs(r)>=.6?'кучли':Math.abs(r)>=.3?'ўртача':'кучсиз';
  const cb=A.curves.filter(({m,c})=>m.carbs&&c.rise!=null),rc=cb.length>=4?corr(cb.map(x=>x.m.carbs),cb.map(x=>x.c.rise)):null;
  return`<div class="card"><h3>📊 Калория ва қанд кўтарилиши</h3><div class="mut" style="font-size:13px">Ҳар бир нуқта — битта овқат (тик ўқ — кўтарилиш, ${U()}). Калория билан боғлиқлик: <b style="color:var(--tx)">${rt}</b>${r!=null?' (r = '+r.toFixed(2)+')':''}${rc!=null?`. Углевод билан: <b style="color:var(--tx)">${Math.abs(rc)>=.6?'кучли':Math.abs(rc)>=.3?'ўртача':'кучсиз'}</b> (r = ${rc.toFixed(2)})`:''}</div>${legend([[C.blue,'Одатий'],[C.orange,'Ноодатий']],'dot',false)}${scatter(pts)}</div>`}
function calCard(A){const d0=new Date(A.s),y=d0.getFullYear(),mo=d0.getMonth(),nd=new Date(y,mo+1,0).getDate(),lead=(d0.getDay()+6)%7,today=sod(Date.now());let c='';
  for(let i=0;i<lead;i++)c+='<div class="na"></div>';
  for(let d=1;d<=nd;d++){const t=new Date(y,mo,d).getTime(),X=stats(t,addD(t,1)),cls=X.n?(X.tir>=80?'ok':X.tir>=50?'warn':'bad'):'',fut=t>Date.now();
    c+=`<div class="${cls}${fut?' fut':''}${t===today?' now':''}" ${fut?'':`onclick="goDay(${t})"`}><b>${d}</b><small>${X.n?fv(X.avg):''}</small></div>`}
  return`<div class="card"><h3>🗓 Ой тақвими</h3><div class="heat hd">${['Ду','Се','Чо','Па','Жу','Ша','Як'].map(x=>`<span>${x}</span>`).join('')}</div><div class="heat">${c}</div>
  <div class="lg" style="margin-top:10px"><span><i class="sq ok"></i>80% ва ундан кўп мақсадда</span><span><i class="sq warn"></i>50–79%</span><span><i class="sq bad"></i>50% дан кам</span></div><div class="mut" style="font-size:12px">Рақам — кунлик ўртача қанд. Кунни босиб, батафсил кўринг.</div></div>`}
function monthTrend(A){const end=Math.min(A.e,addD(sod(Date.now()),1)),days=[];for(let t=A.s;t<end;t=addD(t,1))days.push(t);if(!days.length)return nodata();
  const ma=(fn,t)=>{const w=[];for(let i=0;i<7;i++){const v=fn(addD(t,-i));if(v!=null)w.push(v)}return w.length>=3?mean(w):null};
  const pts=(fn,lab)=>days.map((t,i)=>{const v=fn(t);return v==null?null:{x:i,y:toU(v),tip:`${dLong(t)}\n${lab}: ${fv(v)} ${U()}`}});
  const line=fn=>days.map((t,i)=>{const v=ma(fn,t);return v==null?null:{x:i,y:toU(v)}});
  const fd_=pts(fastOf,'Наҳорги'),pd_=pts(peakOf,'Овқатдан кейин энг юқори');if(!fd_.some(Boolean)&&!pd_.some(Boolean))return nodata();
  const nd=new Date(new Date(A.s).getFullYear(),new Date(A.s).getMonth()+1,0).getDate(),tk=[1,5,10,15,20,25,30].filter(d=>d<=nd).map(d=>({v:d-1,l:String(d)}));
  return legend([[C.blue,'Наҳорги'],[C.orange,'Овқатдан кейин энг юқори']])+lineChart({x:{min:-.7,max:nd-.3,ticks:tk},band:bandU(),series:[{color:C.blue,pts:fd_,noLine:true,r:3.5,dop:.55},{color:C.orange,pts:pd_,noLine:true,r:3.5,dop:.55},{color:C.blue,pts:line(fastOf),noDots:true,w:2.5,connectGaps:true},{color:C.orange,pts:line(peakOf),noDots:true,w:2.5,connectGaps:true}]})
    +'<div class="mut" style="font-size:12px">Нуқта — кунлик қиймат, чизиқ — 7 кунлик ўртача (ўзгариш йўналиши).</div>'}
function weeksTable(A){const rows=[];for(let ws=sow(A.s);ws<A.e;ws=addD(ws,7)){const s=Math.max(ws,A.s),e=Math.min(addD(ws,7),A.e);if(s>Date.now())break;rows.push([new Date(s).getDate()+(e-s>DAY*1.5?'–'+new Date(addD(e,-1)).getDate():''),stats(s,e)])}
  if(!rows.some(r=>r[1].n))return'';
  return`<div class="card"><h3>📅 Ҳафталар бўйича</h3><table><tr><th>Кунлар</th><th>Ўртача</th><th>Наҳорги</th><th>Энг юқори*</th><th>Мақсадда</th><th>Спорт, кун</th></tr>${rows.map(([l,X])=>`<tr><td style="white-space:nowrap">${l}</td><td>${fv(X.avg)}</td><td>${fv(X.fastAvg)}</td><td>${fv(X.peakAvg)}</td><td>${X.tir!=null?Math.round(X.tir)+'%':'—'}</td><td>${X.sDays}</td></tr>`).join('')}</table><div class="mut" style="font-size:12px;margin-top:6px">* Овқатдан кейинги энг юқори қанд (ўртача)</div></div>`}
function trend12(){const w0=sow(Date.now()),W=[];for(let i=11;i>=0;i--){const s=addD(w0,-7*i);W.push({s,X:stats(s,addD(s,7))})}
  if(W.filter(w=>w.X.n).length<2)return'';
  const f=W.map((w,i)=>w.X.fastAvg==null?null:{x:i,y:toU(w.X.fastAvg),tip:`${pLabel('week',w.s,addD(w.s,7))}\nНаҳорги ўртача: ${fv(w.X.fastAvg)}`});
  const p=W.map((w,i)=>w.X.peakAvg==null?null:{x:i,y:toU(w.X.peakAvg),tip:`${pLabel('week',w.s,addD(w.s,7))}\nОвқатдан кейин энг юқори: ${fv(w.X.peakAvg)}`});

/* --- Қанд ўлчови --- */
function mealCands(ts,t){if(t==='pre'||t==='fast')return S.meals.filter(m=>m.ts>=ts-30*MIN&&m.ts<=ts+3*HOUR).sort((a,b)=>a.ts-b.ts);return S.meals.filter(m=>m.ts<=ts+5*MIN&&ts-m.ts<=5*HOUR).sort((a,b)=>b.ts-a.ts)}
function sportCands(ts,t){if(t==='spre')return S.sports.filter(x=>x.ts>=ts-20*MIN&&x.ts<=ts+3*HOUR).sort((a,b)=>a.ts-b.ts);return S.sports.filter(x=>x.ts<=ts&&ts-x.ts<=4*HOUR).sort((a,b)=>b.ts-a.ts)}
function guess(ts){const d0=sod(ts),h=new Date(ts).getHours();
  const P=allPend(ts).filter(p=>p.kind==='slot'&&ts>=p.due-20*MIN);if(P.length){const p=P.reduce((a,b)=>Math.abs(b.due-ts)<Math.abs(a.due-ts)?b:a);return{tag:p.tag,mealId:p.m.id}}
  const fastDone=S.readings.some(r=>r.tag==='fast'&&sod(r.ts)===d0),rec=S.meals.filter(m=>m.ts<=ts+5*MIN&&ts-m.ts<=4*HOUR).sort((a,b)=>b.ts-a.ts)[0];
  if(rec){const mins=(ts-rec.ts)/MIN,have=mealR(rec).map(r=>r.tag);
    if(mins<12&&!have.includes('pre')&&!have.includes('fast'))return{tag:rec.type==='b'&&!fastDone&&h<12?'fast':'pre',mealId:rec.id};
    const c=POST.filter(t=>!have.includes(t));if(c.length&&mins>=12)return{tag:c.reduce((a,b)=>Math.abs(TAGS[b].m-mins)<Math.abs(TAGS[a].m-mins)?b:a),mealId:rec.id}}
  const sp=S.sports.filter(x=>x.ts<=ts&&ts-(x.ts+(x.dur||0)*MIN)<=60*MIN).sort((a,b)=>b.ts-a.ts)[0];
  if(sp&&!S.readings.some(r=>r.sportId===sp.id&&r.tag==='spost'))return{tag:'spost',sportId:sp.id};
  if(!fastDone&&!S.meals.some(m=>sod(m.ts)===d0&&m.ts<=ts)&&h>=3&&h<12)return{tag:'fast'};
  return{tag:h>=21||h<3?'bed':'other'}}
function openReading(id,pre={}){const r=id?S.readings.find(x=>x.id===id):null,ts=r?r.ts:Date.now();
  const g=r?{tag:r.tag,mealId:r.mealId,sportId:r.sportId}:pre.tag?pre:guess(ts);
  F={k:'r',id:r?r.id:null,tag:g.tag||'other',mealId:g.mealId||'',sportId:g.sportId||'',src:r?(r.src||'meter'):S.settings.src,remId:pre.remId||null};
  openSheet(`<h2>${r?'✏️ Ўлчовни таҳрирлаш':'🩸 Қанд ўлчови'}</h2>
  <div class="vin"><input id="f_v" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="${isMg()?'110':'6.1'}" value="${r?fvIn(r.v):''}" oninput="rStat()" onkeydown="if(event.key==='Enter')saveReading()"><span>${U()}</span></div>
  <div id="f_st" class="fst"></div>
  <label>Қачон ўлчадингиз?</label><div id="f_tags">${TAG_GROUPS.map(gr=>`<div class="chips" style="margin-bottom:6px">${gr.map(t=>`<button class="chip${F.tag===t?' on':''}" data-t="${t}" onclick="rTag('${t}')">${TAGS[t].i} ${TAGS[t].n}</button>`).join('')}</div>`).join('')}</div>
  <div id="f_link"></div>
  <label>Ўлчаган вақтингиз</label><input type="datetime-local" id="f_ts" value="${tsIn(ts)}" onchange="rLink()">
  <label>Восита</label><div class="chips" id="f_src">${[['meter','🩸 Глюкометр'],['cgm','📡 Сенсор (CGM)']].map(([k,n])=>`<button class="chip${F.src===k?' on':''}" data-v="${k}" onclick="F.src='${k}';selChip('#f_src','${k}')">${n}</button>`).join('')}</div>
  <label>Изоҳ (ихтиёрий)</label><input id="f_note" value="${esc(r&&r.note||'')}" placeholder="масалан: стресс, кам ухладим, касалман">
  ${btns('saveReading',r?'delReading':'')}`);
  rLink();rStat();if(!r)setTimeout(()=>{const i=$('#f_v');if(i&&sheetOpen)i.focus()},300)}
function rTag(t){F.tag=t;document.querySelectorAll('#f_tags .chip').forEach(c=>c.classList.toggle('on',c.dataset.t===t));const ts=fromInp($('#f_ts').value);F.mealId='';F.sportId='';
  if(t==='fast'||t==='pre'||POST.includes(t)){const c=mealCands(ts,t);if(c.length&&(POST.includes(t)||c[0].ts-ts<=60*MIN))F.mealId=c[0].id}
  if(t==='spre'||t==='spost'){const c=sportCands(ts,t);if(c.length)F.sportId=c[0].id}
  rLink();rStat()}
function rLink(){const el=$('#f_link');if(!el)return;const ts=fromInp($('#f_ts').value),t=F.tag;
  if(t==='fast'||t==='pre'||POST.includes(t)){let c=mealCands(ts,t);if(F.mealId&&!c.find(m=>m.id===F.mealId)){const m=getM(F.mealId);if(m)c=[m,...c]}
    const m=F.mealId&&getM(F.mealId),since=m&&POST.includes(t)?'⏱ Овқатдан '+dur(ts-m.ts)+' ўтган':'';
    el.innerHTML=`<label>Қайси овқат?</label>${c.length?`<select onchange="F.mealId=this.value;rLink()"><option value="">— боғланмасин —</option>${c.map(x=>`<option value="${x.id}"${x.id===F.mealId?' selected':''}>${MEALT[x.type].n} ${hm(x.ts)}${x.name?' — '+esc(x.name.slice(0,28)):''}</option>`).join('')}</select>${since?`<div class="mut" style="font-size:13px;margin-top:4px">${since}</div>`:''}`
      :`<div class="mut" style="font-size:13px">${t==='fast'||t==='pre'?'Овқатни кейин киритсангиз, бу ўлчов унга ўзи боғланади.':'Яқин вақтда киритилган овқат топилмади.'}</div>`}`}
  else if(t==='spre'||t==='spost'){let c=sportCands(ts,t);if(F.sportId&&!c.find(x=>x.id===F.sportId)){const x=S.sports.find(y=>y.id===F.sportId);if(x)c=[x,...c]}
    el.innerHTML=`<label>Қайси машғулот?</label>${c.length?`<select onchange="F.sportId=this.value"><option value="">— боғланмасин —</option>${c.map(x=>`<option value="${x.id}"${x.id===F.sportId?' selected':''}>${(SPORTS[x.type]||SPORTS.other).n} ${hm(x.ts)}</option>`).join('')}</select>`
      :`<div class="mut" style="font-size:13px">${t==='spre'?'Спортни кейин киритсангиз, бу ўлчов унга ўзи боғланади.':'Яқин вақтда киритилган спорт топилмади.'}</div>`}`}
  else el.innerHTML=''}
function rStat(){const el=$('#f_st');if(!el)return;const x=num($('#f_v').value),tg=S.settings.tg[F.tag]||S.settings.tg.other,tt=`Мақсад: ${fv(tg[0])}–${fv(tg[1])}`;
  if(!isFinite(x)){el.innerHTML=`<span class="mut">${tt}</span>`;return}const v=fromU(x);
  if(!okV(v)){el.innerHTML='<span class="tag bad">Қиймат нотўғри кўриняпти</span>';return}el.innerHTML=stTag(st(v,F.tag))+` <span class="mut">${tt}</span>`}
function saveReading(){const x=num($('#f_v').value);if(!isFinite(x))return toast('Қанд қийматини киритинг');const v=fromU(x);if(!okV(v))return toast('Қиймат нотўғри: '+x);
  const ts=tsOut(),isMeal=F.tag==='fast'||F.tag==='pre'||POST.includes(F.tag),isSp=F.tag==='spre'||F.tag==='spost';
  const o={id:F.id||uid(),ts,v,tag:F.tag,src:F.src};if(isMeal&&F.mealId)o.mealId=F.mealId;if(isSp&&F.sportId)o.sportId=F.sportId;const note=$('#f_note').value.trim();if(note)o.note=note;
  if(F.id){const i=S.readings.findIndex(r=>r.id===F.id);if(i>=0)S.readings[i]=o}else S.readings.push(o);
  if(F.remId){const rm=S.rem.find(q=>q.id===F.remId);if(rm)rm.done=true}

  if((s==='low'||s==='vhigh')&&UI.tab!=='today'){UI.tab='today';render();scrollTo(0,0)}}

const mealByTime=ts=>{const h=new Date(ts).getHours();return h>=4&&h<11?'b':h>=11&&h<16?'l':h>=16&&h<22?'d':'s'};
function foodChips(){return S.foods.slice().sort((a,b)=>(b.n||0)-(a.n||0)||a.name.localeCompare(b.name)).map(f=>{const it=F.items.find(x=>x.fid===f.id);return`<button class="chip${it?' on':''}" onclick="addItem('${f.id}')">${esc(f.name)}${it?`<span class="cn">${it.q}</span>`:''}</button>`}).join('')}
const totI=a=>a.reduce((t,x)=>({k:t.k+x.kcal*x.q,c:t.c+x.carbs*x.q,s:t.s+x.sugar*x.q}),{k:0,c:0,s:0});
function drawItems(){const el=$('#f_items');if(!el)return;const it=F.items;$('#f_fc').innerHTML=foodChips();
  el.innerHTML=it.map((x,i)=>`<div class="fi"><div class="sp"><b>${esc(x.name)}</b><div class="mut" style="font-size:12px">${Math.round(x.kcal*x.q)} ккал · ${r1(x.carbs*x.q)} г угл. · ${r1(x.sugar*x.q)} г шакар</div></div><button class="btn sm" onclick="qItem(${i},-1)">−</button><input class="fq" inputmode="decimal" value="${x.q}" onchange="setQ(${i},this.value)"><button class="btn sm" onclick="qItem(${i},1)">＋</button><span class="mut" style="font-size:12px;min-width:44px">${x.unit}</span></div>`).join('');
  const ro=it.length>0;['#f_kcal','#f_carbs','#f_sugar'].forEach(q=>$(q).readOnly=ro);
  if(ro){const t=totI(it);$('#f_kcal').value=Math.round(t.k);$('#f_carbs').value=r1(t.c);$('#f_sugar').value=r1(t.s);$('#f_auto').textContent='↑ Жами таркибдан ўзи ҳисобланди'}
  else{if(F.wasItems){['#f_kcal','#f_carbs','#f_sugar'].forEach(q=>$(q).value='')}$('#f_auto').textContent=''}F.wasItems=ro}
function addItem(fid){const f=S.foods.find(x=>x.id===fid);if(!f)return;const it=F.items.find(x=>x.fid===fid);
  if(it)it.q=Math.round((it.q+1)*100)/100;else F.items.push({fid,name:f.name,unit:f.unit,q:1,kcal:+f.kcal||0,carbs:+f.carbs||0,sugar:+f.sugar||0});drawItems()}
function qItem(i,d){const x=F.items[i];if(!x)return;x.q=Math.round((x.q+d*(HALF.includes(x.unit)?.5:1))*100)/100;if(x.q<=0)F.items.splice(i,1);drawItems()}
function setQ(i,v){const q=num(v);if(isFinite(q)&&q>0)F.items[i].q=q;else F.items.splice(i,1);drawItems()}
function nfToggle(){const e=$('#f_nf');e.style.display=e.style.display==='none'?'block':'none'}
function foodFields(f){return`<label>Таом номи</label><input id="nf_name" value="${esc(f&&f.name||'')}" placeholder="масалан: Қовурдоқ">
  <div class="g2"><div><label>Ўлчов бирлиги</label><select id="nf_unit">${FUNITS.map(u=>`<option${(f?f.unit:'порция')===u?' selected':''}>${u}</option>`).join('')}</select></div><div><label>Калория (1 та учун)</label><input id="nf_kcal" inputmode="decimal" value="${f?f.kcal:''}" placeholder="ккал"></div></div>
  <div class="g2"><div><label>Углевод, г</label><input id="nf_carbs" inputmode="decimal" value="${f?f.carbs:''}" placeholder="0"></div><div><label>Шакар, г</label><input id="nf_sugar" inputmode="decimal" value="${f?f.sugar:''}" placeholder="0"></div></div>`}
function readFood(){const name=$('#nf_name').value.trim(),k=num($('#nf_kcal').value);if(!name){toast('Таом номини киритинг');return null}if(!isFinite(k)||k<0){toast('Калорияни киритинг');return null}

function nfAdd(){const o=readFood();if(!o)return;const f={id:uid(),n:0,...o};S.foods.push(f);save();$('#f_nf').innerHTML=foodFields()+'<button class="btn p full" style="margin-top:10px" onclick="nfAdd()">＋ Рўйхатга қўшиш ва танлаш</button>';$('#f_nf').style.display='none';addItem(f.id);toast('✅ '+f.name+' рўйхатга қўшилди')}
function openMeal(id){const m=id?getM(id):null,ts=m?m.ts:Date.now(),c=m?curve(m):null;

function saveMeal(){const items=F.items.filter(x=>x.q>0),t=items.length?totI(items):null,typed=$('#f_name').value.trim(),ts=tsOut(),old=F.id?getM(F.id):null;

function reportText(){const[s,e]=rangeOf(UI.sm,UI.sa),A=stats(s,e),B=stats(...prevOf(UI.sm,s)),u=U(),L=[`🩸 Қанд ҳисоботи — ${pLabel(UI.sm,s,e)}`,''];
  L.push(`Ўлчовлар: ${A.n} та (${A.mDays} кунда)`);
  if(A.avg!=null)L.push(`Ўртача қанд: ${fv(A.avg)} ${u}${B.avg!=null?` (олдинги давр: ${fv(B.avg)})`:''}`);
  if(A.fastAvg!=null)L.push(`Наҳорги: ${fv(A.fastAvg)}${B.fastAvg!=null?` (олдинги давр: ${fv(B.fastAvg)})`:''}`);
  POST.forEach(t=>{if(A.avgBy[t]!=null)L.push(`${TAGS[t].l}: ${fv(A.avgBy[t])}`)});
  if(A.riseAvg!=null)L.push(`Овқатдан кейинги кўтарилиш (ўртача): ${fd(A.riseAvg)}`);
  if(A.tir!=null)L.push(`Мақсад оралиғида: ${Math.round(A.tir)}%`);
  L.push(`Паст (<${fv(S.settings.low)}): ${A.low} марта · Жуда юқори (≥${fv(S.settings.vhigh)}): ${A.vhigh} марта`);
  if(A.kIn)L.push(`Калория: кунига ўртача ${fk(A.kInAvg)} ккал`);
  if(A.balN)L.push(`Кунлик сарф: ўртача ${fk(A.bAvg)} ккал · баланс ${sgn(A.bal)} ккал/кун`);
  if(A.SP.length)L.push(`Спорт: ${A.sDays} кун, ${A.sMin} дақиқа, ${fk(A.kOut)} ккал`);
  if(A.unusualN)L.push(`Ноодатий овқатлар: ${A.unusualN} та`);
  const e1=eA1c(A);if(UI.sm==='month'&&e1!=null)L.push(`Тахминий HbA1c: ${e1.toFixed(1)}% (ўлчовлардан ҳисобланган, фақат мўлжал)`);
  L.push('','«Қанд назорати» иловаси');return L.join('\n')}
async function shareReport(){const t=reportText();try{if(navigator.share){await navigator.share({title:'Қанд ҳисоботи',text:t});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(t);toast('📋 Ҳисобот нусхаланди — Telegram’га қўйиб юборинг')}catch(e){openSheet(`<h2>📤 Ҳисобот</h2><textarea style="height:320px">${esc(t)}</textarea><button class="btn full" style="margin-top:12px" onclick="closeSheet()">Ёпиш</button>`)}}

function render(){const T={today:'Бугун',log:'Журнал',stats:'Таҳлил',set:'Созлама'};$('#ttl').textContent=T[UI.tab];$('#hdate').textContent=dLong(Date.now());
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===UI.tab));
  try{$('#main').innerHTML=({today:vToday,log:vLog,stats:vStats,set:vSet})[UI.tab]()}catch(e){console.error(e);$('#main').innerHTML=`<div class="alert bad">Хато: ${esc(e.message)}</div>`}}
function tab(t){UI.tab=t;if(t==='stats'&&UI.sm==='day')UI.sa=Date.now();render();scrollTo(0,0)}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}
let tipT;document.addEventListener('pointerdown',e=>{unlockAudio();const tip=$('#tip'),el=e.target&&e.target.closest?e.target.closest('[data-tip]'):null;if(!el){tip.classList.remove('on');return}
  tip.textContent=el.getAttribute('data-tip');tip.classList.add('on');const r=tip.getBoundingClientRect();let x=e.clientX-r.width/2,y=e.clientY-r.height-16;
  x=Math.max(8,Math.min(innerWidth-r.width-8,x));if(y<8)y=e.clientY+20;tip.style.left=x+'px';tip.style.top=y+'px';clearTimeout(tipT);tipT=setTimeout(()=>tip.classList.remove('on'),4000)},{passive:true});
(function init(){if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  render();lastSig=allPend().map(p=>p.key+(p.overdue?1:0)).join(',');
  const k=new URLSearchParams(location.search).get('k');if(k!==null){history.replaceState(null,'',location.pathname);setTimeout(()=>handleKey(k),300)}
  tick();setInterval(tick,15000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){tick();const a=document.activeElement;if(!sheetOpen&&!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))render()}});
  let rt,lw=innerWidth;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(Math.abs(innerWidth-lw)<40)return;lw=innerWidth;const a=document.activeElement;if(!sheetOpen&&!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))render()},250)})})();
